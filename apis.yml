name: GigaCloud Technology
description: >-
  GigaCloud Technology (NASDAQ: GCT) operates the GigaCloud Marketplace, a
  global B2B e-commerce platform for large-parcel merchandise such as furniture,
  home furnishings, fitness equipment, and appliances. The marketplace connects
  manufacturers, primarily in Asia, with resellers across the United States,
  Europe, and Japan, integrating product discovery, transactions, and end-to-end
  cross-border logistics including ocean freight, warehousing, and last-mile
  delivery. The company was added to the API Evangelist network as a
  dcm-ventures portfolio lead. Enrichment probes found no public developer
  portal, API documentation, or well-known discovery surface; the corporate site
  is behind bot protection (HTTP 403), so this profile is limited to verified
  domain-security posture and company identity.
